<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark cosmic plate -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Monogram text HR -->
  <text
    x="11"
    y="44"
    font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Inter, Roboto, sans-serif"
    font-size="28"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-0.5"
  >HR</text>

  <!-- Cyan accent dot with subtle glow matching website theme -->
  <circle cx="51" cy="42" r="4" fill="url(#accent)" filter="url(#glow)" />
</svg>
